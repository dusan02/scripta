services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: verifa_postgres
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 200
    # No ports exposed — Postgres is only accessible from within the Docker network.
    # To access from host for debugging, use: docker exec -it verifa_postgres psql -U verifa
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verifa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-verifa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal:/var/lib/postgresql/wal
    command: >
      postgres
      -c shared_preload_libraries=pgaudit
      -c pgaudit.log=write,ddl
      -c pgaudit.log_catalog=off
      -c pgaudit.log_relation=on
      -c log_line_prefix="%m [%p] %u@%d "
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command="test ! -f /var/lib/postgresql/wal/%f && cp %p /var/lib/postgresql/wal/%f"
      -c max_wal_senders=3
      -c wal_keep_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifa"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Next.js Frontend + API ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: verifa-frontend
    container_name: verifa_frontend
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 200
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verifa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verifa}
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-verifa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verifa}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # No insecure default — app refuses to start in production without NEXTAUTH_SECRET
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      WORKER_URL: http://worker:8000
      # No insecure default — worker callbacks rejected without WORKER_SECRET
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET must be set}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RESULTS_DIR: /app/results
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Verifa.sk <noreply@verifa.sk>}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./worker/results:/app/results:ro  # read-only prístup k vygenerovaným PDF

  # ─── Redis (Arq Broker) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: verifa_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Browserless (Playwright Scraping) ────────────────────
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: verifa_browserless
    restart: unless-stopped
    shm_size: 1g
    mem_limit: 2g
    environment:
      - CONNECTION_TIMEOUT=300000
      - MAX_CONCURRENT_SESSIONS=8
      - TOKEN=${BROWSERLESS_TOKEN:-}

  # ─── Python FastAPI Worker ────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: verifa-worker-image
    container_name: verifa_worker
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 300
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verifa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verifa}
      APP_ENV: ${APP_ENV:-production}
      RESULTS_DIR: /app/results
      TZ: Europe/Bratislava
      PLAYWRIGHT_HEADLESS: "false"
      PLAYWRIGHT_TIMEOUT: "60000"
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEXTAUTH_URL: http://frontend:3000
      CRE_USERNAME: ${CRE_USERNAME:-}
      CRE_PASSWORD: ${CRE_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EXPERT_MODE: "1"
    volumes:
      - ./worker/results:/app/results  # Evidence Binder PDF súbory

  # ─── Arq Background Worker ────────────────────────────────
  arq_worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: verifa-worker-image
    container_name: verifa_arq_worker
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 300
    command: arq src.worker_arq.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-verifa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-verifa}
      APP_ENV: ${APP_ENV:-production}
      RESULTS_DIR: /app/results
      TZ: Europe/Bratislava
      PLAYWRIGHT_HEADLESS: "false"
      PLAYWRIGHT_TIMEOUT: "60000"
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEXTAUTH_URL: http://frontend:3000
      SENTRY_DSN: ${SENTRY_DSN:-}
      CRE_USERNAME: ${CRE_USERNAME:-}
      CRE_PASSWORD: ${CRE_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      EXPERT_MODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./worker/results:/app/results

  # ─── DB Backup (cron pg_dump at 3am) ──────────────────────
  db-backup:
    image: postgres:16-alpine
    container_name: verifa_db_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: verifa
      DB_NAME: verifa
      BACKUP_DIR: /backups
      RETENTION_DAYS: "30"
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Bratislava
    volumes:
      - db_backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "0 3 * * * /backup-db.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root &&
        crond -f -l 2

volumes:
  postgres_data:
  postgres_wal:
  db_backups:
