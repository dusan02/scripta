# =============================================================================
# Verifa-only Crawler & Rate-Limit Policy Proposal (Stream 2 — P1)
# =============================================================================
# SCOPE & SAFETY GUARANTEES:
#   1. Strictly scoped to verifa.sk ($verifa_* variables & zones only).
#   2. ZERO edits to shared /etc/nginx/conf.d/{zz-junk-filter,zz-farm-asn,
#      zz-seo-bot-filter,ai-bot-rate-limits}.conf or snippets/*.conf.
#      The other 4 VPS sites (earningstable.com, gainerslosers.com,
#      premarketprice.com, stockcv.com) remain 100% untouched.
#   3. Googlebot has ZERO blocks and ZERO rate limits (100% SEO protected).
#   4. Signed POST webhooks (/api/billing/webhook for Paddle,
#      /api/email/events and /api/email/inbound for Resend) remain 100%
#      unaffected via existing $verifa_farm_block & $verifa_junk_ua overrides.
#   5. Compatible with release/etapa-2 (90bccb5): supersedes $verifa_ai_rsc_block
#      with broader $verifa_bot_rsc_block and reuses verifa_gptbot +
#      verifa_auth_session zone names cleanly.
#
# DEPLOYMENT (manual operator review + `nginx -t && systemctl reload nginx`):
#   Part A -> append to /etc/nginx/conf.d/zz-verifa-limits.conf (http {} scope)
#   Part B -> apply inside `server { server_name verifa.sk; ... }` in
#             /etc/nginx/sites-enabled/verifa.sk
# =============================================================================

# -----------------------------------------------------------------------------
# PART A: http {} scope — append to /etc/nginx/conf.d/zz-verifa-limits.conf
# -----------------------------------------------------------------------------

# 1. Zero-value high-cost foreign search & scraper bots -> hard 403 on verifa.sk
#    Observed in 34.15h (24-25 Nov 2026):
#    - YandexBot:   26,677 req | 22,993 ISR MISS | 102,282s RT (22.5% of server time)
#    - Baiduspider: 46,887 req | 12,472 ISR MISS |  51,609s RT (11.3% of server time)
#    - BacklinksExtendedBot: 342 req | zero referral value
map $http_user_agent $verifa_unwanted_bot_ua {
    default 0;
    ~*(YandexBot|YandexRenderResourcesBot|YandexMobileBot|Baiduspider|Bytespider|PetalBot|BacklinksExtendedBot) 1;
}

# 2. Synthetic spoofed-browser scraper fingerprint -> hard 403 on verifa.sk
#    Observed: 35,304 hits (200 OK) in 34.15h from 116.179.0.0/16 using a 4.5-year-old
#    exact Chrome/99.0.4844.51 build string (March 2022) to evade per-IP limits.
map $http_user_agent $verifa_spoofed_browser_ua {
    default 0;
    ~*Chrome/99\.0\.4844\.51 1;
}

# 3. Strip Next.js React Server Component prefetch payloads (?_rsc= / RSC header)
#    from non-Google bots. Observed: 63,224 GPTBot + 988 OAI-SearchBot hits in 34.15h.
#    Human browsers and Googlebot are 100% unaffected.
map $http_user_agent $verifa_rsc_bot_ua {
    default 0;
    ~*(GPTBot|OAI-SearchBot|ClaudeBot|PerplexityBot|meta-webindexer|meta-externalagent|Amazonbot|ExaSearchBot|bingbot|Applebot) 1;
}

map "$verifa_rsc_bot_ua:$is_rsc_arg:$is_rsc_header" $verifa_bot_rsc_block {
    "~^1:(1:.|.:1)$" 1;
    default 0;
}

# 4. Block bots from hitting the non-indexable guest checkout funnel (/objednat)
#    Observed: 74,518 GPTBot + 13,842 Baiduspider + 456 bingbot hits in 34.15h.
#    Excludes human browsers and Googlebot (Googlebot obeys robots.txt Disallow: /objednat).
map "$verifa_rsc_bot_ua:$uri" $verifa_bot_objednat_block {
    default 0;
    "~^1:/(en|de|cs|hu|pl)/objednat" 1;
    "~^1:/objednat" 1;
}

# 5. Targeted per-bot rate-limit keys (empty string = bypasses limit_req)
#    Googlebot, OAI-SearchBot, ChatGPT-User, and human browsers resolve to "".
map $http_user_agent $verifa_gptbot_key {
    default "";
    ~GPTBot "verifa_gptbot";
}

map $http_user_agent $verifa_bingbot_key {
    default "";
    ~*bingbot "verifa_bingbot";
}

map $http_user_agent $verifa_exabot_key {
    default "";
    ~*ExaSearchBot "verifa_exabot";
}

# Zones (429 status inherited from existing `limit_req_status 429;` in zz-verifa-limits.conf)
limit_req_zone $verifa_gptbot_key  zone=verifa_gptbot:1m          rate=12r/m;
limit_req_zone $verifa_bingbot_key zone=verifa_bingbot_loc:1m     rate=10r/m;
limit_req_zone $verifa_bingbot_key zone=verifa_bingbot_firma:1m   rate=60r/m;
limit_req_zone $verifa_exabot_key  zone=verifa_exabot:1m          rate=15r/m;
limit_req_zone $binary_remote_addr zone=verifa_auth_session:10m   rate=60r/m;


