# ── Verifa per-IP page rate limit ───────────────────────────────────────────
# Caps distributed farm/spoofed-browser floods that bot-UA maps miss.
# Only full HTML page requests are accounted:
# Assets, API, static, file extensions, AND Next.js RSC prefetches (?_rsc= / header RSC)
# resolve to an empty key = not counted. Enforcement in sites-enabled/verifa.sk.

map $uri $verifa_uri_is_page {
    default 1;
    ~*^/(api|_next|static|assets|samples|results)/ 0;
    ~*\.(js|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot|xml|json|txt|pdf)$ 0;
}

map $arg__rsc $is_rsc_arg {
    default 1;
    ""      0;
}

map $http_rsc $is_rsc_header {
    default 1;
    ""      0;
}

map "$verifa_uri_is_page:$is_rsc_arg:$is_rsc_header" $verifa_page_key {
    "1:0:0" $binary_remote_addr;
    default "";
}

# ── Verifa-only farm ASN override for signed webhooks (P0.1) ────────────────
# Chains $farm_block from zz-farm-asn.conf (regenerated weekly by PM2 job
# pmp-farm-asn-map) without touching shared snippets/farm_asn_filter.conf or
# affecting the other 4 domains on the VPS.
# Only signed POST webhook endpoints bypass the AWS ASN 403 block; Next.js
# still enforces Paddle signature + Paddle /ips allowlist (and Svix HMAC for Resend).
map "$farm_block:$request_method:$uri" $verifa_farm_block {
    default 0;
    "~^1:POST:/api/billing/webhook/?$" 0;
    "~^1:POST:/api/email/(events|inbound)/?$" 0;
    "~^1:" 1;
}

limit_req_zone $verifa_page_key zone=verifa_pages:20m rate=120r/m;
limit_req_status 429;
