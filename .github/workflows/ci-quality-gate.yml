name: CI Quality Gate

on:
  push:
    branches:
      - "master"
      - "release/**"
  pull_request:
    branches:
      - "master"
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ci-quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts-and-ops-tests:
    name: CI & Ops Scripts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell syntax & mock unit tests
        run: bash scripts/ci/tests/run-all.sh

  frontend-quality:
    name: Frontend Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy"
      - name: TypeScript Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Frontend Unit Tests
        run: npm run test:unit

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verifa_ci
          POSTGRES_PASSWORD: verifa_ci_password
          POSTGRES_DB: verifa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verifa_ci -d verifa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://verifa_ci:verifa_ci_password@localhost:5432/verifa_ci"
      DATABASE_URL_UNPOOLED: "postgresql://verifa_ci:verifa_ci_password@localhost:5432/verifa_ci"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - name: Ensure ephemeral secrets for CI build
        run: |
          if [ -z "${NEXTAUTH_SECRET}" ]; then
            echo "NEXTAUTH_SECRET=ci-build-$(head -c32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | cut -c1-32)" >> "$GITHUB_ENV"
          fi
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Sync Prisma Schema to Ephemeral Postgres
        run: npx prisma db push --skip-generate
      - name: Build Next.js
        run: npm run build

  worker-tests:
    name: Worker Pytest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "./worker/requirements.txt"
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi
      - name: Generate Prisma Python Client
        run: python -m prisma generate --schema ../frontend/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy"
      - name: Run Worker Unit Tests
        run: python -m pytest tests/ -q --tb=short -m "not integration"

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - scripts-and-ops-tests
      - frontend-quality
      - frontend-build
      - worker-tests
    steps:
      - name: Evaluate Gate Results
        env:
          SCRIPTS_RESULT: ${{ needs.scripts-and-ops-tests.result }}
          FE_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          FE_BUILD_RESULT: ${{ needs.frontend-build.result }}
          WORKER_RESULT: ${{ needs.worker-tests.result }}
        run: |
          echo "CI Quality Gate Summary:"
          echo "  scripts-and-ops-tests : ${SCRIPTS_RESULT}"
          echo "  frontend-quality      : ${FE_QUALITY_RESULT}"
          echo "  frontend-build        : ${FE_BUILD_RESULT}"
          echo "  worker-tests          : ${WORKER_RESULT}"
          if [ "${SCRIPTS_RESULT}" != "success" ] || \
             [ "${FE_QUALITY_RESULT}" != "success" ] || \
             [ "${FE_BUILD_RESULT}" != "success" ] || \
             [ "${WORKER_RESULT}" != "success" ]; then
            echo "::error::One or more CI quality gate jobs failed."
            exit 1
          fi
