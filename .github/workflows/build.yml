name: Build & CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy"
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit Tests
        run: npm run test:unit

  build-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dummy
          POSTGRES_PASSWORD: dummy
          POSTGRES_DB: dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Ensure NEXTAUTH env vars for CI
        # Forks don't have access to repo secrets — inject temporary values
        # so the build can proceed. Real values are used when available.
        run: |
          if [ -z "${NEXTAUTH_SECRET}" ]; then
            echo "NEXTAUTH_SECRET=ci-build-$(head -c32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | cut -c1-32)" >> $GITHUB_ENV
          fi
          if [ -z "${NEXTAUTH_URL}" ]; then
            echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV
          fi
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Schema to Test DB
        run: npx prisma db push
      - name: Build Next.js
        run: npm run build

  build-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./worker
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Generate Prisma Python Client
        run: python -m prisma generate --schema ../frontend/prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DATABASE_URL_UNPOOLED: "postgresql://dummy:dummy@localhost:5432/dummy"
      - name: Worker Unit Tests
        run: python -m pytest tests/ -q --tb=short -m "not integration"
